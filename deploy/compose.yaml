services:
  app:
    build:
      context: ..
      args:
        SITE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in the deployment env file}
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-/srv/kaleadoskill.env}
    environment:
      NODE_ENV: production
      SITE_URL: https://${SITE_DOMAIN}
      DATABASE_PATH: /app/data/kaleadoskill.sqlite
      TRUST_PROXY: "true"
    volumes:
      - application_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=0755
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  application_data:
  tls_data:
  tls_config:
